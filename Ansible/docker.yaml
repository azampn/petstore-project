- name: Build and Deploy Petstore
  hosts: local
  become: yes
  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        registry_url: https://index.docker.io/v1/
        username: "azam2706"
        password: "dckr_pat_6-xQRRJgmSlWfk8EsFfNTULd31w"

    - name: Build and Push Docker image
      community.docker.docker_image:
        name: "azam2706/petstore"
        tag: latest
        build:
          path: /var/lib/jenkins/workspace/petstorepipeline
        push: yes
        source: build

    - name: Run Petstore container
      community.docker.docker_container:
        name: pet1
        image: "azam2706/petstore:latest"
        state: started
        restart_policy: always
        published_ports:
          - "8082:8080"
